replicaCount: 1

image:
  repository: ghcr.io/praxis-proxy/grid-mock-providers
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

providers:
  - name: a
    credentialSecret: mock-credential-a
    credentialKey: token
    env: {}

args: ["--provider", "openai", "--port", "8080"]

port: 8080
healthPath: /health

networkPolicy:
  enabled: true
  providerGateway:
    instanceLabel: provider-gateway
  gridOperator:
    nameLabel: grid-operator

nameOverride: ""
fullnameOverride: ""
commonLabels: {}
podLabels: {}
podAnnotations: {}
imagePullSecrets: []

resources: {}
nodeSelector: {}
affinity: {}
tolerations: []
topologySpreadConstraints: []
priorityClassName: ""

service:
  type: ClusterIP
