{{- include "praxis-gateway.validateDigest" . }}
{{- include "praxis-gateway.validateConfig" . }}
{{- include "praxis-gateway.validateMounts" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "praxis-gateway.fullname" . }}
  labels:
    {{- include "praxis-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "praxis-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- $selectorLabels := include "praxis-gateway.selectorLabels" . | fromYaml }}
        {{- $podLabels := mustMergeOverwrite (dict) (.Values.podLabels | default dict) $selectorLabels }}
        {{- toYaml $podLabels | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        {{- with .Values.podSecurityContext.runAsUser }}
        runAsUser: {{ . }}
        {{- end }}
        {{- with .Values.podSecurityContext.runAsGroup }}
        runAsGroup: {{ . }}
        {{- end }}
        {{- with .Values.podSecurityContext.fsGroup }}
        fsGroup: {{ . }}
        {{- end }}
        {{- with .Values.podSecurityContext.supplementalGroups }}
        supplementalGroups:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: praxis
          image: {{ include "praxis-gateway.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: {{ .Values.port.name }}
              containerPort: {{ .Values.port.containerPort }}
              protocol: {{ .Values.port.protocol | quote }}
          {{- with .Values.health.readiness }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.health.liveness }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
            {{- if .Values.overlay.enabled }}
            - name: overlay
              mountPath: {{ .Values.overlay.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: {{ .Values.tls.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- range .Values.credentials }}
            - name: credential-{{ .name }}
              mountPath: {{ .mountPath | quote }}
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ .Values.config.existingConfigMap | quote }}
            items:
              - key: {{ .Values.config.key | quote }}
                path: "praxis.yaml"
        {{- if .Values.overlay.enabled }}
        - name: overlay
          configMap:
            name: {{ .Values.overlay.existingConfigMap | quote }}
            {{- with .Values.overlay.items }}
            items:
              {{- toYaml . | nindent 14 }}
            {{- end }}
        {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ .Values.tls.existingSecret | quote }}
        {{- end }}
        {{- range .Values.credentials }}
        - name: credential-{{ .name }}
          secret:
            secretName: {{ .name | quote }}
            optional: {{ .optional | default false }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
