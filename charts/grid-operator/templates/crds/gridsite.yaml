{{- if .Values.crds.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: gridsites.grid.praxis-proxy.io
  annotations:
    {{- if .Values.crds.keep }}
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false,ServerSideApply=true
    {{- else }}
    argocd.argoproj.io/sync-options: ServerSideApply=true
    {{- end }}
spec:
  group: grid.praxis-proxy.io
  names:
    categories:
      - grid
    kind: GridSite
    plural: gridsites
    shortNames:
      - gs
    singular: gridsite
  scope: Cluster
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .spec.gridNetworkRef
          name: Network
          type: string
      name: v1beta1
      schema:
        openAPIV3Schema:
          description: Auto-generated derived type for GridSiteSpec via `CustomResource`
          properties:
            spec:
              description: |-
                Specification for a [`GridSite`].

                Describes a remote site's egress endpoint, region, and
                grid membership.
              properties:
                egress:
                  description: Egress endpoint for data-plane connectivity.
                  nullable: true
                  properties:
                    address:
                      description: Egress gateway `host:port`, overriding discovery; empty uses `status.discovered.egressAddress`.
                      type: string
                    tls:
                      default:
                        mode: mutualTls
                      description: TLS mode for the connection.
                      properties:
                        mode:
                          default: mutualTls
                          description: TLS transport mode, `mutualTls` when absent.
                          enum:
                            - mutualTls
                            - plaintext
                          type: string
                        serverName:
                          description: |-
                            Expected DNS identity for TLS verification.

                            Used as both the TLS SNI value and for certificate SAN
                            verification.  Defaults to `<site>.grid.internal`, the DNS name
                            enrollment issues, for [`TlsMode::MutualTls`]; must be absent for
                            [`TlsMode::Plaintext`].

                            Must be a valid DNS name (not an IP address), at most 253
                            characters.
                          maxLength: 253
                          minLength: 1
                          nullable: true
                          type: string
                      type: object
                  type: object
                gridNetworkRef:
                  description: |-
                    Name of the [`GridNetwork`] this site belongs to.

                    [`GridNetwork`]: crate::crd::grid_network::GridNetwork
                  type: string
                region:
                  description: Deployment region.
                  nullable: true
                  type: string
                sovereigntyZone:
                  description: Sovereignty zone for data residency constraints.
                  nullable: true
                  type: string
                trust:
                  description: |-
                    Trust policy for this site.

                    When configured, the operator verifies the received public certificate against
                    this policy before promoting the site to `Active`. If absent, the site remains
                    `Connecting` with reason `TrustMaterialMissing` regardless of certificate
                    material.
                  nullable: true
                  properties:
                    canonicalFingerprints:
                      description: |-
                        Canonical DER-certificate SHA-256 fingerprint pins.

                        Each entry is a 64-character lowercase hex string computed as
                        `hex(sha256(der_bytes))` where `der_bytes` are the raw DER encoding
                        of the leaf certificate.

                        At most two entries are allowed: the current pin and an optional
                        next pin for bounded rotation overlap.  The probe succeeds if the
                        peer leaf certificate matches **any** entry in this list.
                      items:
                        pattern: ^[0-9a-f]{64}$
                        type: string
                      maxItems: 2
                      minItems: 1
                      nullable: true
                      type: array
                  type: object
                zone:
                  description: Availability zone.
                  nullable: true
                  type: string
              required:
                - gridNetworkRef
              type: object
            status:
              description: Observed status of a [`GridSite`].
              nullable: true
              properties:
                capabilities:
                  default:
                    agentToAgent: false
                    agentTools: false
                    inference: false
                  description: Capabilities offered by this site.
                  properties:
                    agentToAgent:
                      default: false
                      description: Site offers A2A agent access.
                      type: boolean
                    agentTools:
                      default: false
                      description: Site offers MCP tool access.
                      type: boolean
                    inference:
                      default: false
                      description: Site offers inference access.
                      type: boolean
                  type: object
                conditions:
                  description: Observed conditions, `metav1.Condition` shaped and keyed by `type`.
                  items:
                    description: One observed condition, keyed by `type`.
                    properties:
                      lastTransitionTime:
                        description: RFC 3339 time the status last changed.
                        type: string
                      message:
                        default: ""
                        description: Human-readable detail.
                        type: string
                      observedGeneration:
                        default: 0
                        description: The `metadata.generation` this condition was computed from.
                        format: int64
                        type: integer
                      reason:
                        description: Machine-readable reason.
                        type: string
                      status:
                        description: Whether the condition holds.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: Condition type, unique within the list.
                        type: string
                    required:
                      - lastTransitionTime
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                discovered:
                  description: What SWIM gossip reports about this site; observed, never authored.
                  nullable: true
                  properties:
                    absentSince:
                      description: When gossip lost this member (absent or `Dead`), RFC 3339; cleared when it returns.
                      nullable: true
                      type: string
                    egressAddress:
                      description: Gateway address the remote operator advertised.
                      nullable: true
                      type: string
                  type: object
                lastProbeTime:
                  description: |-
                    Timestamp of the last probe whose resulting status was persisted.

                    This is not a liveness heartbeat; it may remain unchanged when a probe
                    produces no status changes.
                  nullable: true
                  type: string
                observedGeneration:
                  default: 0
                  description: Last observed generation.
                  format: int64
                  type: integer
                phase:
                  default: Pending
                  description: Current lifecycle phase.
                  enum:
                    - Pending
                    - Discovered
                    - Connecting
                    - Active
                    - Unreachable
                    - Left
                  type: string
              type: object
          required:
            - spec
          title: GridSite
          type: object
      served: true
      storage: true
      subresources:
        status: {}
{{- end }}
