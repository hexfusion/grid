{{- include "grid-operator.normalize" . }}
{{- if (.Values.operatorConfig | default dict).create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grid-operator.operatorConfig.name" . | quote }}
  labels:
    {{- include "grid-operator.labels" . | nindent 4 }}
data:
  {{- $document := list (include "grid-operator.enrollment.site" . | trim) (include "grid-operator.operatorConfig.serving" . | trim) | compact | join "\n" }}
  {{- with $document }}
  config.yaml: |
    {{- . | nindent 4 }}
  {{- else }}
  config.yaml: ""
  {{- end }}
{{- end }}
