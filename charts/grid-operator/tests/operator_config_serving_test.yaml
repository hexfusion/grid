suite: site serving through the operator config
templates:
  - templates/configmap-operator-config.yaml
tests:
  - it: renders an empty document by default
    asserts:
      - equal:
          path: data["config.yaml"]
          value: ""

  - it: renders serving alone, with no site section
    set:
      operatorConfig.serving.localProviders: Published
      operatorConfig.serving.remote: Members
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |
            serving:
              localProviders: "Published"
              remote: "Members"

  - it: renders only the knobs that are set
    set:
      operatorConfig.serving.localProviders: Published
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |
            serving:
              localProviders: "Published"

  - it: renders serving beside the site section, not under it
    set:
      enrollment.enabled: true
      enrollment.hub: true
      enrollment.siteName: site-d
      enrollment.caBundle.secret: grid-ca
      operatorConfig.serving.remote: Members
    asserts:
      - equal:
          path: data["config.yaml"]
          value: |
            site:
              name: "site-d"
              signerEndpoint:
                url: "https://grid-enrollment.grid-enrollment.svc:8443"
                caBundleRef:
                  kind: Secret
                  name: "grid-ca"
                  key: "ca.crt"
                rotation: "Disabled"
              inviteSecretRef:
                name: "grid-invite-site-d"
                key: "token"
            serving:
              remote: "Members"

  - it: refuses an unknown serving value
    set:
      operatorConfig.serving.localProviders: All
    asserts:
      - failedTemplate:
          errorPattern: "localProviders"
