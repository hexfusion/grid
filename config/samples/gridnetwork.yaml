apiVersion: grid.praxis-proxy.io/v1beta1
kind: GridNetwork
metadata:
  name: example
spec:
  # Basic single-site configuration
  gridId: ""  # Auto-generated on first join
  region: us-west-2
  zone: us-west-2a

  # Provider scoring (defaults to noMetrics when absent).
  # scoringPolicy:
  #   strategy: noMetrics  # "noMetrics" | "queueDepth" | "kvCachePressure"
  # metricsRefreshInterval: "30s"  # optional, minimum 1s; defaults to 300s, or 60s with TLS metrics

  # SWIM protocol settings (defaults)
  swim:
    probeInterval: "5s"
    suspicionTimeout: "10s"
    gossipNodes: 3

  # Consumer gateway reference
  gatewayRefs:
    - name: consumer-gateway
      namespace: default
      consumerConfig:
        enabled: true
        # Cluster endpoints populated by gateway deployment or platform automation
        clusterEndpoints: []

  # TLS Secrets from enrollment or your own CA; null runs without grid TLS
  tls:
    caSecretRef: null
    siteSecretRef: null
    swimKeyRef: null       # Unencrypted SWIM for this example
