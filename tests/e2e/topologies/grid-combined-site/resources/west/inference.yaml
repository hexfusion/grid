apiVersion: grid.praxis-proxy.io/v1beta1
kind: InferenceProvider
metadata:
  name: vcr-west-provider
spec:
  gridNetworkRef: grid-combined-site
  providerKind: openAi
  backendKind: local
  endpoint: http://vcr-inference-west.grid-system.svc.cluster.local:8000
  models:
    - name: Qwen/Qwen3-0.6B
      capabilities: ["text_generation"]
      contextWindow: 4096
  hostSelector:
    matchLabels:
      grid.praxis-proxy.io/provider-site: west
  accessPolicy:
    siteSelector:
      matchLabels: {}
  healthCheck:
    path: /health
    interval: "30s"
    timeout: "5s"
