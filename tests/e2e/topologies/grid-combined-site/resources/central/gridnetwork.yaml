apiVersion: grid.praxis.fast/v1beta1
kind: GridNetwork
metadata:
  name: grid-combined-site
spec:
  siteDiscovery:
    mode: auto
  gridId: grid-combined-site-v1
  region: central
  zone: central-1
  seeds:
    - "{{ captures.west.swim-lb-ip }}:7946"
    - "{{ captures.east.swim-lb-ip }}:7946"
  swim:
    probeInterval: "5s"
    suspicionTimeout: "15s"
    gossipNodes: 3
  tls:
    caSecretRef: null
    siteSecretRef:
      name: consumer-gateway-tls
      namespace: grid-system
    swimKeyRef: null