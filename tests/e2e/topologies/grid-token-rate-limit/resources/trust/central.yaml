apiVersion: grid.praxis.fast/v1beta1
kind: GridSite
metadata:
  name: west
  labels:
    grid.praxis.fast/network: grid-token-rate-limit
spec:
  gridNetworkRef: grid-token-rate-limit
  egress:
    address: "{{ captures.west.swim-lb-ip }}:8443"
    tls:
      mode: mutualTls
      serverName: provider-a.grid.internal
  trust:
    canonicalFingerprints:
      - PEER_WEST_FINGERPRINT
---
apiVersion: grid.praxis.fast/v1beta1
kind: GridSite
metadata:
  name: east
  labels:
    grid.praxis.fast/network: grid-token-rate-limit
spec:
  gridNetworkRef: grid-token-rate-limit
  egress:
    address: "{{ captures.east.swim-lb-ip }}:8443"
    tls:
      mode: mutualTls
      serverName: provider-c.grid.internal
  trust:
    canonicalFingerprints:
      - PEER_EAST_FINGERPRINT
