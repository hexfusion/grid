apiVersion: grid.praxis-proxy.io/v1beta1
kind: GridSite
metadata:
  name: west
  labels:
    grid.praxis-proxy.io/network: grid-token-rate-limit
spec:
  gridNetworkRef: grid-token-rate-limit
  egress:
    address: "{{ captures.west.swim-lb-ip }}:8443"
    tls:
      mode: mutualTls
      serverName: provider-a.grid.internal
  trust:
    canonicalFingerprints:
      - PEER_WEST_FINGERPRINT
---
apiVersion: grid.praxis-proxy.io/v1beta1
kind: GridSite
metadata:
  name: central
  labels:
    grid.praxis-proxy.io/network: grid-token-rate-limit
spec:
  gridNetworkRef: grid-token-rate-limit
  egress:
    address: "{{ captures.central.swim-lb-ip }}:8443"
    tls:
      mode: mutualTls
      serverName: provider-b.grid.internal
  trust:
    canonicalFingerprints:
      - PEER_CENTRAL_FINGERPRINT
