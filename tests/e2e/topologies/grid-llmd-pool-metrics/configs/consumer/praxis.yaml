listeners:
  - name: proxy
    address: "0.0.0.0:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      # Identity first: an unauthenticated caller is refused before the
      # gateway spends anything parsing its body or scoring a route.
      - filter: policy
        config_path: /etc/praxis/policy/policy.yaml
        # No protocol classifier in this chain; the filter fail-closes on
        # missing classification unless told this is identity-only.
        require_protocol_metadata: false
      # Buckets by the authenticated principal, never by a header the
      # caller controls. Rate and burst come from claims the issuer
      # signed, so one filter instance holds every tenant's limit and
      # the gateway carries no table of callers. The values below apply
      # only to a token that carries neither claim.
      - filter: rate_limit
        mode: per_identity
        key_claim: grid_tenant
        rate_claim: grid_rate
        burst_claim: grid_burst
        rate: 5
        burst: 10
      - filter: json_body_field
        field: model
        header: X-Model
      - filter: headers
        response_set:
          - name: X-Grid-LlmD-Consumer-Gateway
            value: "{{ cluster.name }}"
      - filter: intelligent_route
        overlay_file: /etc/praxis/routing/routing-overlay.json
        model_header: X-Model
        # Live load from the local operator. Unqualified, so it carries this
        # site and every peer the operator collected; ?target= would narrow it
        # to one site and leave the remote candidates unscored.
        load:
          endpoint: "https://grid-operator-signals:9091/metrics"
          queue_metric: "llm_d_epp_average_queue_size"
          collect:
            - "llm_d_epp_average_queue_size"
          interval_ms: 2000
          max_age_ms: 15000
          # The same Secret the operator serves this listener with, so the
          # gateway presents the site's own key and is recognised as this
          # site rather than refused as an unnamed caller.
          tls:
            ca_path: /etc/praxis/tls/ca.crt
            cert_path: /etc/praxis/tls/tls.crt
            key_path: /etc/praxis/tls/tls.key
        provider_hop_clusters:
          - llmd-pool-a-provider
          - llmd-pool-b-provider
          - llmd-pool-c-provider
        expected_overlay_scope:
          network: grid-llmd-pool-metrics
          gateway: consumer-gateway
          namespace: grid-system
          local_site: "{{ cluster.name }}"
        reload:
          enabled: true
          debounce_ms: 500
        session_affinity:
          enabled: true
          header: X-Session-Id
          ttl_secs: 3600
      - filter: load_balancer
        clusters:
          - name: llmd-pool-a-provider
            tls:
              ca:
                ca_path: /etc/praxis/tls/ca.crt
              client_cert:
                cert_path: /etc/praxis/tls/tls.crt
                key_path: /etc/praxis/tls/tls.key
              sni: pool-a.grid.internal
              verify: true
            endpoints:
              - "{{ captures.pool-a.provider-gateway-ip }}:8443"
          - name: llmd-pool-b-provider
            tls:
              ca:
                ca_path: /etc/praxis/tls/ca.crt
              client_cert:
                cert_path: /etc/praxis/tls/tls.crt
                key_path: /etc/praxis/tls/tls.key
              sni: pool-b.grid.internal
              verify: true
            endpoints:
              - "{{ captures.pool-b.provider-gateway-ip }}:8443"
          - name: llmd-pool-c-provider
            tls:
              ca:
                ca_path: /etc/praxis/tls/ca.crt
              client_cert:
                cert_path: /etc/praxis/tls/tls.crt
                key_path: /etc/praxis/tls/tls.key
              sni: pool-c.grid.internal
              verify: true
            endpoints:
              - "{{ captures.pool-c.provider-gateway-ip }}:8443"

admin:
  address: "127.0.0.1:9901"

shutdown_timeout_secs: 5

# Every provider is reached at a MetalLB address on the cluster network, and
# the issuer the policy filter fetches keys from is one too. The gateway treats
# those as sensitive addresses and refuses to reach them unless told otherwise,
# which is right facing the internet and wrong for a gateway whose peers all
# live on the same private network.
insecure_options:
  allow_private_endpoints: true
