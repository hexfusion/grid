# Identity for tenant traffic entering the grid.
#
# One issuer serves the network. Its name is fixed and its address is captured
# at deploy time, because MetalLB assigns the latter and only sites off-cluster
# need it: the name is compared, the address is dialled.
#
# Authorization is deliberately trivial: what this demo asks is what happens
# after identity is established, not who is allowed through.

plugin_settings:
  routing_enabled: true

plugins:
  - name: tenant-jwt
    kind: identity/jwt
    hooks: [identity.resolve]
    on_error: fail
    config:
      header: Authorization
      # A workload role resolves no subject, and the limiter would see no identity.
      role: user
      trusted_issuers:
          # Compared as a string, never dialled, so it holds for every site.
        - issuer: "http://keycloak.grid-system:8180/realms/grid"
          # Empty disables `aud`; the tenant is identified by its claims.
          audiences: []
          algorithms: ["RS256"]
          decoding_key:
            kind: jwks_url
            url: "http://{{ captures.pool-a.keycloak-ip }}:8180/realms/grid/protocol/openid-connect/certs"
            # Plaintext to the issuer, which is a demo-only allowance.
            insecure_http: true
      claim_mapper: standard

global:
  authentication:
    - tenant-jwt
  authorization:
    pre_invocation:
      - "require(authenticated)"
  response:
    status: 401
    body: "{\"error\":\"authentication required\"}"
