apiVersion: apps/v1
kind: Deployment
metadata:
  name: pressure-generator
  namespace: grid-system
  labels:
    app.kubernetes.io/part-of: grid-llmd-pool-metrics
spec:
  replicas: 0
  selector:
    matchLabels:
      app: pressure-generator
      pool: "pool-a"
  template:
    metadata:
      labels:
        app: pressure-generator
        pool: "pool-a"
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: "curlimages/curl:8.5.0"
          imagePullPolicy: "IfNotPresent"
          command: ["sh", "-c"]
          args:
            - |
              GW="http://consumer-gateway.grid-system.svc.cluster.local:8080/v1/chat/completions"
              BODY='{"model":"Qwen/Qwen3-0.6B","messages":[{"role":"user","content":"Explain distributed systems architecture patterns including consensus algorithms, replication strategies, partitioning schemes, and consistency models in detail."}],"max_tokens":64}'
              worker() {
                local ID=$1 T=0 O=0 F=0 A=0 B=0
                echo "0 0 0 0 0" > "/tmp/w${ID}"
                while true; do
                  STATUS=$(curl -s -o /dev/null -w '%{http_code}' -D "/tmp/hdr${ID}" \
                    --max-time 30 -X POST "$GW" \
                    -H 'Content-Type: application/json' -d "$BODY" 2>/dev/null || echo "000")
                  T=$((T + 1))
                  if [ "$STATUS" = "200" ]; then
                    O=$((O + 1))
                    PROV=$(grep -i 'X-Grid-LlmD-Provider-Gateway' "/tmp/hdr${ID}" 2>/dev/null | tr -d '\r\n' | sed 's/.*: //')
                    case "$PROV" in
                      *pool-a*) A=$((A + 1)) ;;
                      *pool-b*) B=$((B + 1)) ;;
                    esac
                  else
                    F=$((F + 1))
                  fi
                  echo "$T $O $F $A $B" > "/tmp/w${ID}"
                done
              }

              for i in 1 2 3 4; do
                worker "$i" &
              done

              while true; do
                sleep 2
                T=0 O=0 F=0 A=0 B=0
                for i in 1 2 3 4; do
                  if [ -f "/tmp/w${i}" ]; then
                    read WT WO WF WA WB < "/tmp/w${i}" 2>/dev/null || continue
                    T=$((T + ${WT:-0})); O=$((O + ${WO:-0}))
                    F=$((F + ${WF:-0})); A=$((A + ${WA:-0})); B=$((B + ${WB:-0}))
                  fi
                done
                echo "STATS $T $O $F $A $B"
              done
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
