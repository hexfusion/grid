# Keycloak, as the demo's identity provider.
#
# Development mode on purpose: no TLS, in-memory database, realm imported at
# startup. What is real is what the gateway depends on, RS256 and JWKS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: grid-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: keycloak}
  template:
    metadata:
      labels: {app: keycloak}
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0
          args: ["start-dev", "--import-realm", "--http-port=8180"]
          env:
            # Fixes `iss` regardless of which address a caller minted through,
            # so in-cluster and load balancer callers get interchangeable tokens.
            - name: KC_HOSTNAME
              value: "http://keycloak.grid-system:8180"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - {name: http, containerPort: 8180}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          readinessProbe:
            httpGet: {path: /realms/grid, port: 8180}
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {cpu: "200m", memory: "512Mi"}
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: grid-system
spec:
  # Reachable from every site: one issuer serves the whole grid.
  type: LoadBalancer
  selector: {app: keycloak}
  ports:
    - {name: http, port: 8180, targetPort: http}
