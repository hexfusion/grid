apiVersion: grid.praxis.fast/v1beta1
kind: InferenceProvider
metadata:
  name: vcr-west-provider
spec:
  gridNetworkRef: glb-demo
  providerKind: openAi
  backendKind: local
  endpoint: http://vcr-inference.grid-system.svc.cluster.local:8000
  models:
    - name: Qwen/Qwen3-0.6B
      capabilities: ["text_generation"]
      contextWindow: 4096
  hostSelector:
    matchLabels:
      grid.praxis.fast/provider-site: west-provider
  accessPolicy:
    siteSelector:
      matchLabels: {}
  healthCheck:
    path: /health
    interval: "30s"
    timeout: "5s"
