apiVersion: grid.praxis-proxy.io/v1beta1
kind: GridNetwork
metadata:
  name: glb-demo
spec:
  siteDiscovery:
    mode: auto
  gridId: grid-glb-demo-v1
  region: east
  zone: east-edge-1
  seeds:
    - "{{ captures.east-provider.swim-lb-ip }}:7946"
    - "{{ captures.west-edge.swim-lb-ip }}:7946"
    - "{{ captures.west-provider.swim-lb-ip }}:7946"
  swim:
    probeInterval: "5s"
    suspicionTimeout: "15s"
    gossipNodes: 3
  gatewayRefs:
    - name: edge-gateway
      namespace: grid-system
      localSiteName: east-edge
      consumerConfig:
        enabled: false
        clusterEndpoints:
          - cluster: vcr-east-provider
            address: "{{ captures.east-provider.provider-gateway-ip }}:8443"
            transport:
              mode: mutualTls
              sni: east-provider.grid.internal
          - cluster: vcr-east-provider-secondary
            address: "{{ captures.east-provider.provider-gateway-ip }}:8443"
            transport:
              mode: mutualTls
              sni: east-provider.grid.internal
          - cluster: vcr-west-provider
            address: "{{ captures.west-provider.provider-gateway-ip }}:8443"
            transport:
              mode: mutualTls
              sni: west-provider.grid.internal
  tls:
    caSecretRef:
      name: edge-gateway-tls
      namespace: grid-system
    siteSecretRef:
      name: edge-gateway-tls
      namespace: grid-system
    swimKeyRef: null
