apiVersion: grid.praxis-proxy.io/v1alpha1
kind: GridNetwork
metadata:
  name: glb-demo
  labels:
    grid.praxis-proxy.io/auto-discover-sites: "true"
spec:
  gridId: ""
  region: us-east
  zone: us-east-1a

  seeds:
    - "{{ captures.site-us-west.swim-lb-ip }}:7946"
    - "{{ captures.site-us-central.swim-lb-ip }}:7946"

  swim:
    probeInterval: "5s"
    suspicionTimeout: "10s"
    gossipNodes: 3

  gatewayRefs:
    - name: consumer-gateway
      namespace: grid-system
      localSiteName: site-us-east
      consumerConfig:
        enabled: true
        configMapName: praxis-consumer-config
        listenerPort: 8080
        credentialMountBase: /run/secrets/grid-credentials
        tlsCertMountPath: /etc/praxis/tls
        clusterEndpoints:
          - cluster: sim-provider-us-west
            address: "{{ captures.site-us-west.provider-gateway-ip }}:8080"
            transport:
              mode: plaintext
          - cluster: sim-provider-us-central
            address: "{{ captures.site-us-central.provider-gateway-ip }}:8080"
            transport:
              mode: plaintext

  tls:
    caSecretRef: null
    siteSecretRef: null
    swimKeyRef: null
