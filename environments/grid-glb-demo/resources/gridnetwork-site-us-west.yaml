apiVersion: grid.praxis-proxy.io/v1alpha1
kind: GridNetwork
metadata:
  name: glb-demo
  labels:
    grid.praxis-proxy.io/auto-discover-sites: "true"
spec:
  gridId: ""
  region: us-west
  zone: us-west-2a

  seeds:
    - "{{ captures.site-us-east.swim-lb-ip }}:7946"
    - "{{ captures.site-us-central.swim-lb-ip }}:7946"

  swim:
    probeInterval: "5s"
    suspicionTimeout: "10s"
    gossipNodes: 3

  tls:
    caSecretRef: null
    siteSecretRef: null
    swimKeyRef: null
