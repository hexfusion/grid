apiVersion: apps/v1
kind: Deployment
metadata:
  name: grid-operator
  namespace: grid-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grid-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grid-operator
    spec:
      containers:
        - name: operator
          image: grid-operator:glb-demo
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: GRID_SWIM_BIND_ADDR
              value: "0.0.0.0:7946"
            - name: GRID_SWIM_ADVERTISE_ADDR
              value: "{{ captures.site-us-west.swim-lb-ip }}:7946"
            - name: GRID_SWIM_SITE_NAME
              value: "site-us-west"
            - name: GRID_SWIM_SEEDS
              value: "{{ captures.site-us-east.swim-lb-ip }}:7946,{{ captures.site-us-central.swim-lb-ip }}:7946"
            - name: GRID_GATEWAY_SERVICE_NAME
              value: "provider-gateway"
            - name: RUST_LOG
              value: "info"
