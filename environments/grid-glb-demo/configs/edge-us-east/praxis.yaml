listeners:
  - name: proxy
    address: "0.0.0.0:8080"
    filter_chains:
      - main

filter_chains:
  - name: main
    filters:
      - filter: json_body_field
        field: model
        header: X-Model
      - filter: grid_route
        overlay_file: /etc/grid/grid-config.json
        model_header: X-Model
        reload:
          enabled: true
          debounce_ms: 500
        session_affinity:
          enabled: true
          header: X-Session-Id
          ttl_secs: 3600
      - filter: load_balancer
        clusters:
          - name: site-us-west
            endpoints:
              - "{{ captures.site-us-west.provider-gateway-ip }}:8080"
          - name: site-us-central
            endpoints:
              - "{{ captures.site-us-central.provider-gateway-ip }}:8080"

admin:
  address: "127.0.0.1:9901"
