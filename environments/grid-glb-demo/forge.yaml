apiVersion: forge.praxis.dev/v1alpha1
kind: Environment

metadata:
  name: grid-glb-demo

spec:
  runtime:
    provider: docker
    clusterPrefix: grid-glb

  network:
    crossCluster: true
    dnsZone: grid-glb.test

  clusters:
    - name: site-us-east
      stacks: [gateway-api, metallb, grid-operator, swim-lb, site-us-east-demo]
      properties:
        region: us-east
        role: site

    - name: site-us-west
      stacks: [gateway-api, metallb, grid-operator, swim-lb, site-us-west-demo, inference-sim]
      properties:
        region: us-west
        role: site

    - name: site-us-central
      stacks: [gateway-api, metallb, grid-operator, swim-lb, site-us-central-demo, inference-sim]
      properties:
        region: us-central
        role: site

  services:
    - name: grid-overlay-sync-us-east
      image: "grid-overlay-sync:glb-demo"
      autoStart: false
      network: environment
      volumes:
        - source: configs/overlay-sync
          target: /etc/overlay-sync
          readOnly: true
        - source: .forge/runtime/edge-us-east
          target: /output
        - source: .forge/runtime/kubeconfig/site-us-east
          target: /kube
          readOnly: true
      env:
        KUBECONFIG: /kube/config
        RUST_LOG: info
      args:
        - "--config"
        - "/etc/overlay-sync/sync.yaml"
      restart: on-failure

    - name: grid-edge-us-east
      image: "praxis-ai:glb-demo"
      autoStart: false
      network: environment
      dependsOn:
        - grid-overlay-sync-us-east
      ports:
        - bindAddress: "127.0.0.1"
          host: 8080
          container: 8080
          protocol: tcp
      volumes:
        - source: .forge/runtime/edge-us-east/praxis
          target: /etc/praxis
          readOnly: true
        - source: .forge/runtime/edge-us-east
          target: /etc/grid
          readOnly: true
      restart: on-failure
      healthCheck:
        type: tcp
        port: 8080
        interval: "2s"
        timeout: "1s"
        retries: 30

  stacks:
    gateway-api:
      description: Gateway API CRDs (standard channel)
      steps:
        - type: url
          url: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
          sha256: 97598bf6ab3b33b9b5c5432bdd24de091e4e9c3aa0575ebb0710a2a19cd64d64

    metallb:
      description: MetalLB load balancer with auto-configured address pool
      steps:
        - type: url
          url: https://raw.githubusercontent.com/metallb/metallb/v0.14.9/config/manifests/metallb-native.yaml
          sha256: 951065e85692aa106f1bb5d5a487d9306154923a794ab1d82122881cbaf588e4
        - type: wait
          resource: deployment/controller
          namespace: metallb-system
          condition: available
          timeout: "120s"
        - type: metallb-auto-pool
          name: forge-pool

    grid-operator:
      description: Grid CRDs and operator (local wrapper referencing /deploy)
      steps:
        - type: kustomize
          path: resources/grid-operator
        - type: wait
          resource: deployment/grid-operator
          namespace: grid-system
          condition: available
          timeout: "120s"

    swim-lb:
      description: SWIM membership LoadBalancer Service for cross-cluster discovery
      steps:
        - type: manifest
          path: resources/operator-swim-service.yaml
        - type: capture
          resource: svc/operator-swim-lb
          namespace: grid-system
          jsonpath: "{.status.loadBalancer.ingress[0].ip}"
          key: swim-lb-ip
          timeout: "60s"
          interval: "2s"

    site-us-east-demo:
      description: Grid network, site, and SWIM seed wiring for GLB entry point
      steps:
        - type: template-manifest
          path: resources/gridnetwork-site-us-east.yaml
        - type: template-manifest
          path: resources/operator-env-site-us-east.yaml
        - type: template-file
          source: configs/edge-us-east/praxis.yaml
          target: .forge/runtime/edge-us-east/praxis/praxis.yaml
        - type: manifest
          path: resources/site-us-east.yaml
        - type: manifest
          path: policies/provider-access.yaml
        - type: manifest
          path: policies/external-auth-demo.yaml

    site-us-west-demo:
      description: US-West site, inference provider, and SWIM seed wiring
      steps:
        - type: template-manifest
          path: resources/gridnetwork-site-us-west.yaml
        - type: template-manifest
          path: resources/operator-env-site-us-west.yaml
        - type: manifest
          path: resources/site-us-west.yaml
        - type: manifest
          path: resources/site-us-west-inference.yaml

    site-us-central-demo:
      description: US-Central site, inference provider, and SWIM seed wiring
      steps:
        - type: template-manifest
          path: resources/gridnetwork-site-us-central.yaml
        - type: template-manifest
          path: resources/operator-env-site-us-central.yaml
        - type: manifest
          path: resources/site-us-central.yaml
        - type: manifest
          path: resources/site-us-central-inference.yaml

    inference-sim:
      description: Simulated inference backends with LoadBalancer exposure
      steps:
        - type: manifest
          path: resources/provider-workloads.yaml
        - type: manifest
          path: resources/provider-gateway.yaml
        - type: capture
          resource: svc/provider-gateway
          namespace: grid-system
          jsonpath: "{.status.loadBalancer.ingress[0].ip}"
          key: provider-gateway-ip
          timeout: "60s"
          interval: "2s"
