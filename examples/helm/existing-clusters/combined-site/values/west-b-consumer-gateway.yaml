# Praxis consumer gateway values for the west-b site (combined topology).
#
# Install:
#   helm upgrade --install consumer-gateway ../../../../charts/praxis-gateway \
#     --kube-context "$WEST_B_CONTEXT" \
#     --namespace grid-system \
#     --values west-b-consumer-gateway.yaml

fullnameOverride: consumer-gateway

image:
  repository: ghcr.io/praxis-proxy/grid-ai-rollup
  tag: v0.1.3
  pullPolicy: IfNotPresent

config:
  existingConfigMap: consumer-praxis-config
  key: praxis.yaml

overlay:
  enabled: true
  # Name: grid-overlay-{GridNetwork name}-{gateway service name}
  existingConfigMap: grid-overlay-NETWORK-consumer-gateway

tls:
  enabled: true
  existingSecret: consumer-tls

service:
  enabled: true
  type: ClusterIP
  port: 8080
